<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="pd-wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="80" fill="#090d16" stroke="#06b6d4" stroke-width="2" />
  
  <!-- Wave background -->
  <path d="M 40,130 Q 70,80 110,120 T 160,110 L 160,160 L 40,160 Z" fill="url(#pd-wave)" opacity="0.3" />
  
  <!-- Anti-gravity surfboard -->
  <ellipse cx="100" cy="128" rx="55" ry="12" fill="#0284c7" stroke="#38bdf8" stroke-width="2" transform="rotate(-15 100 128)" />
  
  <!-- Pee Dub Surfer Body -->
  <circle cx="100" cy="82" r="24" fill="#10b981" stroke="#059669" stroke-width="2" />
  
  <!-- Neon Sunglasses -->
  <rect x="84" y="78" width="14" height="8" rx="2" fill="#090d16" stroke="#06b6d4" stroke-width="1.5" />
  <rect x="102" y="78" width="14" height="8" rx="2" fill="#090d16" stroke="#06b6d4" stroke-width="1.5" />
  <line x1="98" y1="82" x2="102" y2="82" stroke="#06b6d4" stroke-width="1.5" />
  
  <!-- Surfer grin -->
  <path d="M 94,96 Q 100,102 106,96" fill="none" stroke="#065f46" stroke-width="2" stroke-linecap="round" />
  <text x="100" y="166" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">PEE DUB</text>
</svg>
