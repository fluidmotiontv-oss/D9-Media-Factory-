<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="d9-cyan-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="1" />
    </linearGradient>
    <radialGradient id="d9-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="d9-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00e5ff" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="95" fill="url(#d9-glow)" />

  <!-- Outer Kinetic Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#d9-cyan-gold)" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.85" />
  <circle cx="100" cy="100" r="72" fill="#090d16" stroke="#00e5ff" stroke-width="1.5" filter="url(#d9-drop-shadow)" />

  <!-- Harmonic Nodes -->
  <circle cx="100" cy="28" r="4.5" fill="#d4af37" />
  <circle cx="172" cy="100" r="4.5" fill="#00e5ff" />
  <circle cx="100" cy="172" r="4.5" fill="#10b981" />
  <circle cx="28" cy="100" r="4.5" fill="#d4af37" />

  <!-- Character Core (Dragon 9 Avatar Sprite) -->
  <path d="M 65,85 C 65,60 135,60 135,85 C 135,115 120,135 100,138 C 80,135 65,115 65,85 Z" fill="#111827" stroke="url(#d9-cyan-gold)" stroke-width="2" />

  <!-- Expressive Eyes -->
  <ellipse cx="84" cy="88" rx="8" ry="11" fill="#00e5ff" />
  <ellipse cx="116" cy="88" rx="8" ry="11" fill="#00e5ff" />
  <circle cx="86" cy="86" r="3.5" fill="#ffffff" />
  <circle cx="118" cy="86" r="3.5" fill="#ffffff" />

  <!-- Smart Audio Wave Mouth / Sensor -->
  <path d="M 88,112 Q 100,122 112,112" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round" />

  <!-- 432Hz Harmonic Crest -->
  <path d="M 92,54 L 100,40 L 108,54 Z" fill="#d4af37" />
  <text x="100" y="156" font-family="monospace" font-size="9" fill="#00e5ff" text-anchor="middle" letter-spacing="1">D9·432Hz</text>
</svg>
